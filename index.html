<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>23450150946韦丽雯的第一个网页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;}
/* ThreeJS画布，底层3D场景 */
#threeCanvas{
    position:fixed;
    top:0;left:0;
    width:100vw;height:100vh;
    /* 修改背景：原版红色改为黑色 */
    background-color:#000000;
    z-index:1;
}

/* ========== 点击纸球弹出的展开面板（纸条内容容器） ========== */
.popup-panel{
    position:fixed;
    top:50%;left:50%;
    transform:translate(-50%,-50%) scale(0.8);
    width:750px;max-width:92vw;
    height:550px;max-height:85vh;
    background:#ffffff;
    padding:32px;
    border-radius:6px;
    z-index:10;
    overflow:auto;
    opacity:0;
    pointer-events:none;
    transition: all 0.4s ease;
}
.popup-panel.active{
    opacity:1;
    pointer-events:auto;
    transform:translate(-50%,-50%) scale(1);
}
.close-btn{
    position:absolute;
    top:12px;right:16px;
    font-size:26px;cursor:pointer;color:#333;
}
.popup-panel h1{
    color:#245b9c;text-align:center;margin-bottom:20px;
}
.popup-panel p{
    font-size:16px;line-height:1.7;margin-bottom:8px;
}
hr{margin:20px 0;border:1px solid #ccc;}
table{width:100%;border-collapse:collapse;margin:12px 0;}
th,td{border:1px solid #333;padding:8px;text-align:center;}
ul{padding-left:24px;line-height:1.8;}

/* ✨【自定义素材区域，以后放图片/视频/PDF】 */
.custom-area{margin-top:16px;}
.custom-area img{max-width:100%;border-radius:6px;}
.custom-area video{max-width:100%;border-radius:6px;}
</style>
</head>
<body>
<!-- 3D场景画布 -->
<canvas id="threeCanvas"></canvas>

<!-- 点击纸球弹出的展开纸条面板 -->
<div class="popup-panel" id="paperPanel">
    <span class="close-btn" id="closeBtn">×</span>
    <h1>23450150946韦丽雯的第一个网页</h1>
    <p>学号：23450150946</p>
    <p>姓名：韦丽雯</p>
    <hr>
    <h2>个人简介</h2>
    <p>我正在学习网页制作，使用VSCode编写HTML与CSS代码，搭建本地站点。</p>
    <h3>网页信息</h3>
    <table>
        <tr><th>项目</th><th>内容</th></tr>
        <tr><td>编辑器</td><td>VSCode</td></tr>
        <tr><td>站点名称</td><td>23450150946韦丽雯</td></tr>
        <tr><td>开发语言</td><td>HTML + CSS + Three.js</td></tr>
    </table>
    <h3>学习清单</h3>
    <ul>
        <li>创建本地站点文件夹</li>
        <li>编写HTML网页</li>
        <li>ThreeJS 3D揉纸球交互效果</li>
        <li>上传网页到免费空间</li>
    </ul>
    <!-- =====================
    【以后在这里替换素材：图片 / 视频 / iframe PDF】
    示例：
    <img src="./images/作品图.jpg" alt="我的作品">
    <video controls><source src="./video/test.mp4"></video>
    <iframe src="xxx.pdf" width="100%" height="300"></iframe>
    ====================== -->
    <div class="custom-area">
        <p>访问下面链接了解更多前端知识：<a href="https://www.runoob.com/" target="_blank">菜鸟教程</a></p>
    </div>
</div>

<!-- 引入ThreeJS CDN，不用下载本地文件 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ========== 3D揉纸球场景复刻 ==========
let scene, camera, renderer, controls, paperBalls = [];
const panel = document.getElementById('paperPanel');
const closeBtn = document.getElementById('closeBtn');

// 初始化场景
function init(){
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 12);

    renderer = new THREE.WebGLRenderer({canvas:document.getElementById('threeCanvas'),antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000); // 背景黑色，替换原版红色
    renderer.shadowMap.enabled = true;

    // 轨道控制器（可以旋转、缩放场景，和原版demo一样）
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 灯光
    const ambientLight = new THREE.AmbientLight(0xffffff,0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff,0.9);
    dirLight.position.set(5,8,5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // 地面
    const groundGeo = new THREE.PlaneGeometry(30,30);
    const groundMat = new THREE.MeshStandardMaterial({color:0xaaaaaa});
    const ground = new THREE.Mesh(groundGeo,groundMat);
    ground.rotation.x = -Math.PI/2;
    ground.receiveShadow = true;
    scene.add(ground);

    // 批量生成多个纸球（和截图里一堆纸球效果一致）
    const paperMat = new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.8});
    for(let i=0;i<18;i++){
        const sphereGeo = new THREE.SphereGeometry(0.65,16,12);
        const mesh = new THREE.Mesh(sphereGeo,paperMat);
        mesh.castShadow = true;
        // 随机摆放位置
        mesh.position.x = (Math.random()-0.5)*14;
        mesh.position.z = (Math.random()-0.5)*9;
        mesh.position.y = Math.random()*0.3;
        scene.add(mesh);
        paperBalls.push(mesh);
    }

    // 射线检测：点击纸球，弹出面板
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    window.addEventListener('pointerdown',(e)=>{
        pointer.x = (e.clientX/window.innerWidth)*2-1;
        pointer.y = -(e.clientY/window.innerHeight)*2+1;
        raycaster.setFromCamera(pointer,camera);
        const intersects = raycaster.intersectObjects(paperBalls);
        if(intersects.length>0){
            panel.classList.add('active');
        }
    })

    // 关闭弹窗
    closeBtn.onclick = ()=> panel.classList.remove('active');
    window.addEventListener('resize',onWindowResize);
    animate();
}

function onWindowResize(){
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene,camera);
}
init();
</script>
</body>
</html>
